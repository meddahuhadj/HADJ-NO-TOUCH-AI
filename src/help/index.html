<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'unsafe-inline'; img-src 'self' data: file:">
<title>HADJ No-Touch — Aide / Help / مساعدة</title>
<!-- صفحة محلية بالكامل: لا خطوط ولا سكربتات من الإنترنت (سياسة CSP أعلاه تمنع أي اتصال). -->
<style>
  :root {
    --bg: #070b14; --surface: #0f172a; --surface-2: #182238; --line: #263554;
    --text: #f1f5f9; --dim: #94a3b8; --accent: #22d3ee; --ok: #4ade80; --warn: #f59e0b; --err: #f43f5e;
    --radius: 14px;
  }
  @media (prefers-contrast: more) {
    :root { --bg: #000; --surface: #000; --surface-2: #0a0a0a; --line: #fff; --dim: #fff; --accent: #ffd400; }
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: "Segoe UI", "Dubai", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  header {
    position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
  }
  .bar { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; margin-inline-end: auto; }
  .langs { display: flex; gap: 6px; }
  .langs button {
    font: inherit; font-size: .9rem; color: var(--text); background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 14px; cursor: pointer; min-height: 36px;
  }
  .langs button[aria-pressed="true"] { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  nav { max-width: 1080px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  nav a { font-size: .85rem; text-decoration: none; color: var(--dim); padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); }
  nav a:hover { color: var(--text); }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 24px 0 4px; }
  .lead { color: var(--dim); margin: 0 0 8px; }
  section { margin-top: 36px; scroll-margin-top: 110px; }
  h2 { font-size: 1.35rem; margin: 0 0 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  ol.steps { margin: 0; padding-inline-start: 1.4em; display: grid; gap: 8px; }
  .safety { border-color: var(--warn); }
  .safety ul { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; font-size: 1.1rem; font-weight: 600; }
  .safety p { margin: 6px 0 0; color: var(--dim); }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .gesture { padding: 0; overflow: hidden; }
  .gesture svg { display: block; width: 100%; height: auto; }
  .gesture .txt { padding: 10px 14px 14px; }
  .gesture h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .gesture p { margin: 0; color: var(--dim); font-size: .95rem; }
  .gesture.pause { border-color: var(--warn); }
  .note { color: var(--dim); font-size: .9rem; margin-top: 10px; }
  ul.plain { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 6px; }
  .legend { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .legend div { display: flex; gap: 10px; align-items: center; }
  .legend svg { flex: none; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tools input {
    flex: 1 1 260px; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px;
  }
  .tools select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 44px; }
  details.sec { margin-bottom: 8px; }
  details.sec > summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
  details.sec .count { color: var(--dim); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  td.ph span { display: inline-block; background: var(--surface-2); border-radius: 8px; padding: 1px 8px; margin: 2px; }
  .tag { font-size: .75rem; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .tag.d { color: var(--warn); border: 1px solid var(--warn); }
  .tag.a { color: var(--ok); border: 1px solid var(--ok); }
  details.faq { margin-bottom: 8px; }
  details.faq summary { cursor: pointer; font-weight: 600; }
  details.faq p { margin: 6px 0 0; color: var(--dim); }
  .empty { color: var(--dim); padding: 12px 0; }
  .motion-note { display: none; color: var(--dim); font-size: .85rem; }
  @media (prefers-reduced-motion: reduce) { .motion-note { display: block; } }
  @media print { header { position: static; } .tools, nav, .langs { display: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">HADJ No-Touch</span>
    <div class="langs" role="group" aria-label="Langue / Language / اللغة">
      <button type="button" data-lang="ar" lang="ar">العربية</button>
      <button type="button" data-lang="fr" lang="fr">Français</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main">
  <h1 data-t="title"></h1>
  <p class="lead" data-t="subtitle"></p>

  <section id="start">
    <h2 data-t="start_h"></h2>
    <div class="card"><ol class="steps"><li data-t="start_1"></li><li data-t="start_2"></li><li data-t="start_3"></li></ol></div>
  </section>

  <section id="safety">
    <h2 data-t="safety_h"></h2>
    <div class="card safety">
      <ul><li data-t="safety_fist"></li><li data-t="safety_voice"></li><li data-t="safety_key"></li></ul>
      <p data-t="safety_resume"></p>
      <p data-t="safety_confirm"></p>
    </div>
  </section>

  <section id="gestures">
    <h2 data-t="gestures_h"></h2>
    <p class="motion-note" data-t="motion_off"></p>
    <div class="grid" id="gesture-grid"></div>
    <p class="note" data-t="gestures_tip"></p>
  </section>

  <section id="voice">
    <h2 data-t="voice_h"></h2>
    <div class="card"><ul class="plain">
      <li data-t="voice_wake"></li><li data-t="voice_dictation"></li><li data-t="voice_grid"></li><li data-t="voice_profile"></li><li data-t="voice_macro"></li><li data-t="voice_lang"></li>
    </ul></div>
  </section>

  <section id="indicator">
    <h2 data-t="ind_h"></h2>
    <div class="card legend" id="legend"></div>
  </section>

  <section id="commands">
    <h2 data-t="cmd_h"></h2>
    <div class="tools">
      <input id="q" type="search" autocomplete="off">
      <label><span data-t="cmd_other_lang"></span>
        <select id="phrase-lang"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>
      </label>
    </div>
    <p class="note" data-t="cmd_slot"></p>
    <div id="cmd-list"></div>
  </section>

  <section id="trouble">
    <h2 data-t="tr_h"></h2>
    <div class="card" id="faq"></div>
  </section>

  <section id="privacy">
    <h2 data-t="priv_h"></h2>
    <div class="card"><ul class="plain"><li data-t="priv_1"></li><li data-t="priv_2"></li><li data-t="priv_3"></li></ul></div>
  </section>
</main>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var H = window.HELP;
  var NAV = ["start", "safety", "gestures", "voice", "indicator", "commands", "trouble", "privacy"];
  var NAV_KEYS = ["nav_start", "nav_safety", "nav_gestures", "nav_voice", "nav_indicator", "nav_commands", "nav_trouble", "nav_privacy"];
  var FAQ = ["cam", "mic", "slow", "lang", "stuck"];
  var state = { lang: "fr", phraseLang: null, q: "" };
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function t(key) {
    var e = H.ui[key];
    var s = (e && (e[state.lang] || e.fr)) || key;
    return s.replace("{wake}", H.ui.wake[state.lang]);
  }
  function el(tag, attrs, text) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  // تبسيط للبحث: حروف صغيرة، بلا تشكيل ولا همزات (نفس مبدأ محلل الأوامر)
  function norm(s) {
    return s.toLowerCase().normalize("NFD").replace(/[̀-ًͯ-ٰٟ]/g, "")
      .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
  }
  function phraseText(p) { return p.replace(/\{[a-z_]+\}/g, "…"); }

  function renderStatic() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = t(n.getAttribute("data-t")); });
    document.querySelectorAll(".langs button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === state.lang));
    });
    var nav = document.getElementById("nav");
    nav.textContent = "";
    NAV.forEach(function (id, i) { nav.appendChild(el("a", { href: "#" + id }, t(NAV_KEYS[i]))); });
    document.getElementById("q").placeholder = t("cmd_search");
    document.getElementById("q").setAttribute("aria-label", t("cmd_search"));
    document.getElementById("phrase-lang").value = state.phraseLang;
  }

  function renderGestures() {
    var grid = document.getElementById("gesture-grid");
    grid.textContent = "";
    H.gestures.forEach(function (g) {
      var card = el("article", { "class": "card gesture" + (g.id === "pause" ? " pause" : "") });
      var holder = el("div", { "aria-hidden": "true" });
      holder.innerHTML = g.svg;   // SVG مولّد محلياً من generate.py (لا محتوى خارجي)
      var svg = holder.querySelector("svg");
      if (reduceMotion && svg && svg.pauseAnimations) { svg.setCurrentTime(1.1); svg.pauseAnimations(); }
      var txt = el("div", { "class": "txt" });
      txt.appendChild(el("h3", null, g.title[state.lang]));
      txt.appendChild(el("p", null, g.how[state.lang]));
      card.appendChild(holder);
      card.appendChild(txt);
      grid.appendChild(card);
    });
  }

  // رموز دائرة الحالة كما ترسمها الواجهة (ui/status_orb.py)
  var ORB = {
    ind_ready: '<circle cx="20" cy="20" r="16" fill="#0f172a" stroke="#22c55e" stroke-width="3"/><rect x="16.5" y="11" width="7" height="12" rx="3.5" fill="none" stroke="#22c55e" stroke-width="2.2"/><path d="M13 20a7 7 0 0 0 14 0M20 27v3" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>',
    ind_voice: '<circle cx="20" cy="20" r="19" fill="#4ade80" opacity=".35"/><circle cx="20" cy="20" r="16" fill="#0f172a" stroke="#4ade80" stroke-width="3"/><rect x="16.5" y="11" width="7" height="12" rx="3.5" fill="#4ade80"/><path d="M13 20a7 7 0 0 0 14 0M20 27v3" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>',
    ind_hand: '<circle cx="20" cy="20" r="16" fill="#0f172a" stroke="#22c55e" stroke-width="3"/><path d="M20 30v-8M20 22l-6-9M20 22l-2-11M20 22l2-11M20 22l5-9M20 26l-7-3" fill="none" stroke="#f1f5f9" stroke-width="1.8" stroke-linecap="round"/>',
    ind_pause: '<circle cx="20" cy="20" r="16" fill="#0f172a" stroke="#64748b" stroke-width="3"/><rect x="14" y="13" width="4" height="14" rx="1" fill="#64748b"/><rect x="22" y="13" width="4" height="14" rx="1" fill="#64748b"/>',
    ind_error: '<circle cx="20" cy="20" r="16" fill="#0f172a" stroke="#ef4444" stroke-width="3"/><path d="M20 12v10" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="27" r="1.8" fill="#ef4444"/>',
    ind_badge: '<circle cx="20" cy="20" r="16" fill="#0f172a" stroke="#22c55e" stroke-width="3"/><circle cx="31" cy="31" r="6" fill="#10b981" stroke="#0f172a" stroke-width="2"/>'
  };
  function renderLegend() {
    var box = document.getElementById("legend");
    box.textContent = "";
    Object.keys(ORB).forEach(function (k) {
      var row = el("div");
      var holder = el("span", { "aria-hidden": "true" });
      holder.innerHTML = '<svg width="40" height="40" viewBox="0 0 40 40">' + ORB[k] + "</svg>";
      row.appendChild(holder);
      row.appendChild(el("span", null, t(k)));
      box.appendChild(row);
    });
  }

  function renderCommands() {
    var list = document.getElementById("cmd-list");
    list.textContent = "";
    var q = norm(state.q.trim());
    var pl = state.phraseLang;
    var total = 0;
    H.sections.forEach(function (sec) {
      var rows = sec.commands.filter(function (c) {
        if (!q) return true;
        var hay = H.langs.map(function (l) { return c.phrases[l].join(" | "); }).join(" | ") + " " + sec.title[state.lang] + " " + c.id;
        return norm(hay).indexOf(q) !== -1;
      });
      if (!rows.length) return;
      total += rows.length;
      var d = el("details", { "class": "sec" });
      if (q) d.open = true;
      var sum = el("summary", null, sec.title[state.lang] + " ");
      sum.appendChild(el("span", { "class": "count" }, "(" + rows.length + ")"));
      d.appendChild(sum);
      var table = el("table");
      rows.forEach(function (c) {
        var tr = el("tr");
        var ph = el("td", { "class": "ph", lang: pl, dir: pl === "ar" ? "rtl" : "ltr" });
        (c.phrases[pl].length ? c.phrases[pl] : c.phrases.en).forEach(function (p) { ph.appendChild(el("span", null, phraseText(p))); });
        var tags = el("td");
        if (c.dangerous) tags.appendChild(el("span", { "class": "tag d" }, t("cmd_danger")));
        if (c.always) tags.appendChild(el("span", { "class": "tag a" }, t("cmd_always")));
        tr.appendChild(ph);
        tr.appendChild(tags);
        table.appendChild(tr);
      });
      d.appendChild(table);
      list.appendChild(d);
    });
    if (!total) list.appendChild(el("p", { "class": "empty" }, t("cmd_none")));
  }

  function renderFaq() {
    var box = document.getElementById("faq");
    box.textContent = "";
    FAQ.forEach(function (k) {
      var d = el("details", { "class": "faq" });
      d.appendChild(el("summary", null, t("tr_" + k + "_q")));
      d.appendChild(el("p", null, t("tr_" + k + "_a")));
      box.appendChild(d);
    });
  }

  function render() { renderStatic(); renderGestures(); renderLegend(); renderCommands(); renderFaq(); }

  function setLang(lang, remember) {
    if (H.langs.indexOf(lang) === -1) return;
    var follow = !state.phraseLang || state.phraseLang === state.lang;
    state.lang = lang;
    if (follow) state.phraseLang = lang;
    if (remember) store("help-lang", lang);
    render();
  }

  // اللغة: من الرابط (#ar) ثم آخر اختيار ثم لغة المتصفح
  var fromHash = (location.hash || "").slice(1);
  var initial = H.langs.indexOf(fromHash) !== -1 ? fromHash
    : (load("help-lang") || (navigator.language || "fr").slice(0, 2));
  if (H.langs.indexOf(initial) === -1) initial = "fr";
  if (H.langs.indexOf(fromHash) !== -1) history.replaceState(null, "", location.pathname);
  setLang(initial, false);

  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang"), true); });
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; renderCommands(); });
  document.getElementById("phrase-lang").addEventListener("change", function (e) { state.phraseLang = e.target.value; renderCommands(); });
})();
</script>
</body>
</html>
