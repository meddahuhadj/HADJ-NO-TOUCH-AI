# ===========================================================================
#  الأوامر الصوتية الافتراضية
#  لإضافة أوامرك أو تعديل أمر: أنشئ user_data/custom_commands.yaml بنفس البنية.
#  الأمر المخصص الذي يحمل نفس id يستبدل الأمر الافتراضي.
#
#  بنية الأمر:
#    id:        معرّف فريد
#    phrases:   العبارات لكل لغة. {app} و {text} خانات تلتقط باقي الكلام.
#    action + args   ← إجراء واحد
#    أو steps: [ {action: ..., <args>}, ... ]   ← ماكرو من عدة خطوات
#    dangerous: true ← يتطلب تأكيداً ("نعم"/"لا") قبل التنفيذ
#    always: true    ← يعمل حتى بدون كلمة التنبيه (مخصص لأمر الإيقاف الطارئ)
#
#  التشكيل والهمزات والتاء المربوطة لا تهم: "أغلق" = "اغلق"، "النافذة" = "النافذه".
#  قائمة الإجراءات المتاحة موجودة في README.
# ===========================================================================
commands:
  # ---------------- الأمان والتحكم بالتطبيق نفسه ----------------
  - id: emergency_stop
    always: true
    phrases:
      ar: ["توقف فورا", "توقف", "قف"]
      en: ["stop now", "stop", "emergency stop"]
      fr: ["stop", "arrête", "arrête tout", "stop maintenant"]
    action: app.pause

  - id: resume
    phrases:
      ar: ["استانف", "استمر", "تابع", "فعل التحكم"]
      en: ["resume", "continue", "enable control"]
      fr: ["reprends", "reprendre", "continue", "active le contrôle"]
    action: app.resume

  - id: sleep
    phrases:
      ar: ["نم", "اسكت", "توقف عن الاستماع"]
      en: ["go to sleep", "stop listening"]
      fr: ["dors", "va dormir", "arrête d'écouter"]
    action: app.sleep

  - id: switch_language
    phrases:
      ar: ["بدل اللغة", "غير اللغة"]
      en: ["switch language", "change language"]
      fr: ["change de langue", "changer de langue"]
    action: app.toggle_language   # بالتناوب: العربية ← الإنجليزية ← الفرنسية

  - id: language_arabic
    phrases:
      ar: ["العربية", "بالعربي"]
      en: ["arabic", "speak arabic"]
      fr: ["arabe", "en arabe"]
    action: app.set_language
    args: {lang: ar}

  - id: language_english
    phrases:
      ar: ["الانجليزية", "انجليزي"]
      en: ["english"]
      fr: ["anglais", "en anglais"]
    action: app.set_language
    args: {lang: en}

  - id: language_french
    phrases:
      ar: ["الفرنسية", "فرنسي"]
      en: ["french", "speak french"]
      fr: ["français", "en français"]
    action: app.set_language
    args: {lang: fr}

  - id: continuous_on
    phrases:
      ar: ["استماع مستمر", "فعل الاستماع المستمر"]
      en: ["continuous listening on", "enable continuous listening"]
      fr: ["écoute continue", "active l'écoute continue"]
    action: app.set_continuous
    args: {value: true}

  - id: continuous_off
    phrases:
      ar: ["اوقف الاستماع المستمر", "الغ الاستماع المستمر"]
      en: ["continuous listening off", "disable continuous listening"]
      fr: ["désactive l'écoute continue", "arrête l'écoute continue"]
    action: app.set_continuous
    args: {value: false}

  - id: calibrate
    phrases:
      ar: ["معايرة", "معايرة الكاميرا", "ابدا المعايرة"]
      en: ["calibrate", "calibrate camera", "start calibration"]
      fr: ["calibrage", "calibre la caméra", "lance le calibrage"]
    action: app.calibrate

  - id: open_settings
    phrases:
      ar: ["اعدادات التطبيق", "افتح اعدادات التطبيق"]
      en: ["app settings", "open app settings"]
      fr: ["paramètres de l'application", "ouvre les réglages"]
    action: app.open_settings

  - id: help
    phrases:
      ar: ["مساعدة", "افتح المساعدة", "دليل الاستخدام"]
      en: ["help", "open help", "user guide"]
      fr: ["aide", "ouvre l'aide", "guide d'utilisation"]
    action: app.help

  - id: camera_wake
    phrases:
      ar: ["ايقظ الكاميرا", "فعل الكاميرا"]
      en: ["wake up the camera", "camera on"]
      fr: ["réveille la caméra", "allume la caméra"]
    action: app.wake_camera

  - id: refresh_apps
    phrases:
      ar: ["حدث قائمة التطبيقات", "حدث التطبيقات"]
      en: ["refresh apps", "refresh applications"]
      fr: ["actualise les applications", "mets à jour les applications"]
    action: app.refresh_apps

  # ---------------- الإملاء والشبكة ----------------
  # داخل الإملاء: "أوقف الإملاء" للخروج، "امسح ذلك" لحذف آخر جملة، والترقيم منطوقاً.
  - id: start_dictation
    phrases:
      ar: ["ابدا الاملاء", "وضع الاملاء", "املاء"]
      en: ["start dictation", "dictation mode", "dictate"]
      fr: ["commence la dictée", "mode dictée", "dictée"]
    action: app.start_dictation

  - id: stop_dictation
    phrases:
      ar: ["اوقف الاملاء", "انهاء الاملاء"]
      en: ["stop dictation", "end dictation"]
      fr: ["arrête la dictée", "fin de la dictée"]
    action: app.stop_dictation

  # الشبكة: قل رقماً (1-9) للتكبير، ثم "انقر" أو "انقر مرتين" أو "انقر يمين"، "رجوع"، "إلغاء".
  - id: show_grid
    phrases:
      ar: ["اعرض الشبكة", "اظهر الشبكة", "الشبكة", "شبكة الماوس"]
      en: ["show grid", "mouse grid", "grid"]
      fr: ["affiche la grille", "grille", "montre la grille"]
    action: app.show_grid

  # ---------------- التطبيقات والبحث ----------------
  - id: open_app
    phrases:
      ar: ["افتح {app}", "شغل {app}"]
      en: ["open {app}", "launch {app}", "start {app}"]
      fr: ["ouvre {app}", "lance {app}", "démarre {app}"]
    action: open_app
    args: {name: "{app}"}

  - id: search
    phrases:
      ar: ["ابحث عن {text}", "بحث عن {text}"]
      en: ["search for {text}", "search {text}"]
      fr: ["cherche {text}", "recherche {text}"]
    action: search
    args: {text: "{text}"}

  - id: type_text
    phrases:
      ar: ["اكتب {text}"]
      en: ["type {text}"]
      fr: ["écris {text}", "tape {text}"]
    action: type_text
    args: {text: "{text}"}

  # ---------------- النوافذ ----------------
  - id: close_window
    phrases:
      ar: ["اغلق النافذة", "سكر النافذة", "اغلق"]
      en: ["close window", "close the window", "close"]
      fr: ["ferme la fenêtre", "ferme"]
    action: close_window

  - id: close_without_saving
    dangerous: true
    phrases:
      ar: ["اغلق بدون حفظ", "اغلق دون حفظ"]
      en: ["close without saving"]
      fr: ["ferme sans enregistrer"]
    steps:
      - {action: close_window}
      - {action: wait, ms: 600}
      - {action: key, key: "n"}

  - id: minimize
    phrases:
      ar: ["صغر النافذة", "صغر"]
      en: ["minimize window", "minimize"]
      fr: ["réduis la fenêtre", "réduis", "minimise"]
    action: minimize_window

  - id: maximize
    phrases:
      ar: ["كبر النافذة", "كبر"]
      en: ["maximize window", "maximize"]
      fr: ["agrandis la fenêtre", "agrandis", "maximise"]
    action: maximize_window

  - id: switch_window
    phrases:
      ar: ["بدل النافذة", "النافذة التالية", "بدل"]
      en: ["switch window", "next window"]
      fr: ["change de fenêtre", "fenêtre suivante"]
    action: switch_window

  - id: previous_window
    phrases:
      ar: ["النافذة السابقة"]
      en: ["previous window"]
      fr: ["fenêtre précédente"]
    action: switch_window_prev

  - id: zoom_in
    phrases:
      ar: ["تقريب", "كبر الخط", "كبر العرض"]
      en: ["zoom in"]
      fr: ["zoom avant", "agrandis le texte"]
    action: zoom_in
    args: {steps: 2}

  - id: zoom_out
    phrases:
      ar: ["تبعيد", "صغر الخط", "صغر العرض"]
      en: ["zoom out"]
      fr: ["zoom arrière", "réduis le texte"]
    action: zoom_out
    args: {steps: 2}

  - id: show_desktop
    phrases:
      ar: ["سطح المكتب", "اظهر سطح المكتب"]
      en: ["show desktop", "desktop"]
      fr: ["bureau", "affiche le bureau"]
    action: show_desktop

  - id: new_tab
    phrases:
      ar: ["تبويب جديد", "علامة تبويب جديدة"]
      en: ["new tab"]
      fr: ["nouvel onglet"]
    action: browser_new_tab

  - id: close_tab
    phrases:
      ar: ["اغلق التبويب", "اغلق علامة التبويب"]
      en: ["close tab"]
      fr: ["ferme l'onglet"]
    action: browser_close_tab


  # ---------------- التحرير ----------------
  - id: copy
    phrases: {ar: ["انسخ", "نسخ"], en: ["copy"], fr: ["copie", "copier"]}
    action: hotkey
    args: {keys: [ctrl, c]}

  - id: paste
    phrases: {ar: ["الصق", "لصق"], en: ["paste"], fr: ["colle", "coller"]}
    action: hotkey
    args: {keys: [ctrl, v]}

  - id: cut
    phrases: {ar: ["قص"], en: ["cut"], fr: ["coupe", "couper"]}
    action: hotkey
    args: {keys: [ctrl, x]}

  - id: undo
    phrases: {ar: ["تراجع"], en: ["undo"], fr: ["annule", "annuler"]}
    action: hotkey
    args: {keys: [ctrl, z]}

  - id: redo
    phrases: {ar: ["اعد", "اعادة"], en: ["redo"], fr: ["rétablis", "refais"]}
    action: hotkey
    args: {keys: [ctrl, y]}

  - id: save
    phrases: {ar: ["احفظ", "حفظ"], en: ["save"], fr: ["enregistre", "sauvegarde"]}
    action: hotkey
    args: {keys: [ctrl, s]}

  - id: select_all
    phrases: {ar: ["حدد الكل", "تحديد الكل"], en: ["select all"], fr: ["sélectionne tout", "tout sélectionner"]}
    action: hotkey
    args: {keys: [ctrl, a]}

  - id: delete
    dangerous: true
    phrases: {ar: ["احذف", "حذف"], en: ["delete"], fr: ["supprime", "efface"]}
    action: key
    args: {key: delete}

  - id: enter
    phrases: {ar: ["ادخال", "انتر"], en: ["enter", "press enter"], fr: ["entrée", "valide"]}
    action: key
    args: {key: enter}

  - id: escape
    phrases: {ar: ["اخرج", "هروب"], en: ["escape"], fr: ["échappe", "touche échappe"]}
    action: key
    args: {key: esc}

  - id: tab
    phrases: {ar: ["الحقل التالي", "تاب"], en: ["tab", "next field"], fr: ["champ suivant", "tabulation"]}
    action: key
    args: {key: tab}

  # ---------------- الفأرة والتمرير ----------------
  - id: click
    phrases: {ar: ["انقر", "اضغط", "كليك"], en: ["click"], fr: ["clique", "clic"]}
    action: click

  - id: double_click
    phrases: {ar: ["انقر مرتين", "نقرة مزدوجة", "دبل كليك"], en: ["double click"], fr: ["double clic", "double clique"]}
    action: double_click

  - id: right_click
    phrases: {ar: ["انقر بالزر الايمن", "انقر يمين", "زر ايمن"], en: ["right click"], fr: ["clic droit", "clique droit"]}
    action: right_click

  - id: scroll_down
    phrases: {ar: ["مرر للاسفل", "مرر لتحت", "انزل"], en: ["scroll down"], fr: ["descends", "défile vers le bas"]}
    action: scroll
    args: {direction: down}

  - id: scroll_up
    phrases: {ar: ["مرر للاعلى", "مرر لفوق", "اطلع"], en: ["scroll up"], fr: ["monte", "défile vers le haut"]}
    action: scroll
    args: {direction: up}

  - id: page_down
    phrases: {ar: ["الصفحة التالية", "صفحة للاسفل"], en: ["page down"], fr: ["page suivante"]}
    action: key
    args: {key: pagedown}

  - id: page_up
    phrases: {ar: ["الصفحة السابقة", "صفحة للاعلى"], en: ["page up"], fr: ["page précédente"]}
    action: key
    args: {key: pageup}

  # ---------------- الصوت والنظام ----------------
  - id: volume_up
    phrases: {ar: ["ارفع الصوت", "علي الصوت"], en: ["volume up", "louder"], fr: ["monte le son", "plus fort"]}
    action: volume_up

  - id: volume_down
    phrases: {ar: ["اخفض الصوت", "وطي الصوت"], en: ["volume down", "quieter"], fr: ["baisse le son", "moins fort"]}
    action: volume_down

  - id: mute
    phrases: {ar: ["كتم الصوت", "اكتم الصوت", "كتم"], en: ["mute", "mute sound"], fr: ["coupe le son", "muet"]}
    action: mute

  - id: screenshot
    phrases: {ar: ["لقطة شاشة", "صور الشاشة"], en: ["screenshot", "take a screenshot"], fr: ["capture d'écran", "capture l'écran"]}
    action: screenshot

  # قفل الشاشة يُعدّ خطراً: فتحها قد يحتاج كلمة مرور لا يمكن إدخالها دون لمس
  - id: lock_screen
    dangerous: true
    phrases: {ar: ["اقفل الشاشة", "قفل الشاشة"], en: ["lock screen", "lock the screen"], fr: ["verrouille l'écran"]}
    action: lock_screen

  - id: shutdown
    dangerous: true
    phrases: {ar: ["اطفئ الجهاز", "ايقاف التشغيل"], en: ["shut down", "shutdown computer"], fr: ["éteins l'ordinateur", "arrête l'ordinateur"]}
    action: shutdown

  - id: restart
    dangerous: true
    phrases: {ar: ["اعد تشغيل الجهاز", "اعادة التشغيل"], en: ["restart computer", "reboot"], fr: ["redémarre l'ordinateur"]}
    action: restart

  # ---------------- الوسائط والنوافذ المساعدة ----------------
  - id: media_play_pause
    phrases: {ar: ["شغل او اوقف الموسيقى", "شغل الموسيقى", "وقف الموسيقى"], en: ["play or pause music", "play music", "pause music"], fr: ["lecture ou pause", "lance la musique", "met la musique en pause"]}
    action: media_play_pause

  - id: media_next
    phrases: {ar: ["المقطع التالي", "الاغنية التالية", "تخطي"], en: ["next track", "next song", "skip"], fr: ["morceau suivant", "chanson suivante", "passer"]}
    action: media_next

  - id: media_prev
    phrases: {ar: ["المقطع السابق", "الاغنية السابقة"], en: ["previous track", "previous song"], fr: ["morceau précédent", "chanson précédente"]}
    action: media_prev

  - id: task_view
    phrases: {ar: ["عرض كل النوافذ", "كل النوافذ"], en: ["task view", "show all windows", "show tasks"], fr: ["afficher toutes les fenêtres", "vue des tâches"]}
    action: task_view

  - id: clipboard_history
    phrases: {ar: ["سجل الحافظة", "سجل النسخ"], en: ["clipboard history", "paste history"], fr: ["historique du presse-papiers"]}
    action: show_clipboard_history

  - id: emoji_picker
    phrases: {ar: ["الرموز التعبيرية", "الايموجي", "الملصقات"], en: ["emoji picker", "open emojis"], fr: ["picker d'émojis", "ouvre les emojis"]}
    action: show_emoji_picker

  - id: open_explorer
    phrases: {ar: ["افتح مستكشف الملفات", "مستكشف الملفات"], en: ["open file explorer", "file explorer"], fr: ["ouvre l'explorateur de fichiers"]}
    action: open_explorer

  - id: open_task_manager
    phrases: {ar: ["افتح مدير المهام", "مدير المهام"], en: ["open task manager", "task manager"], fr: ["ouvre le gestionnaire des tâches"]}
    action: open_task_manager

  # ---------------- ترتيب النافذة الحالية ----------------
  - id: snap_left
    phrases: {ar: ["النافذة لليسار", "ثبتها لليسار"], en: ["snap window left", "snap to the left"], fr: ["fenêtre à gauche", "aligne à gauche"]}
    action: snap
    args: {position: left}

  - id: snap_right
    phrases: {ar: ["النافذة لليمين", "ثبتها لليمين"], en: ["snap window right", "snap to the right"], fr: ["fenêtre à droite", "aligne à droite"]}
    action: snap
    args: {position: right}

  - id: snap_top
    phrases: {ar: ["النافذة للاعلى"], en: ["snap window up", "snap to the top"], fr: ["fenêtre en haut"]}
    action: snap
    args: {position: top}

  - id: snap_bottom
    phrases: {ar: ["النافذة للاسفل"], en: ["snap window down", "snap to the bottom"], fr: ["fenêtre en bas"]}
    action: snap
    args: {position: bottom}

  - id: snap_topleft
    phrases: {ar: ["النافذة في الزاوية العليا اليسرى"], en: ["snap window to the top left"], fr: ["fenêtre en haut à gauche"]}
    action: snap
    args: {position: topleft}

  - id: snap_topright
    phrases: {ar: ["النافذة في الزاوية العليا اليمنى"], en: ["snap window to the top right"], fr: ["fenêtre en haut à droite"]}
    action: snap
    args: {position: topright}

  - id: snap_bottomleft
    phrases: {ar: ["النافذة في الزاوية السفلى اليسرى"], en: ["snap window to the bottom left"], fr: ["fenêtre en bas à gauche"]}
    action: snap
    args: {position: bottomleft}

  - id: snap_bottomright
    phrases: {ar: ["النافذة في الزاوية السفلى اليمنى"], en: ["snap window to the bottom right"], fr: ["fenêtre en bas à droite"]}
    action: snap
    args: {position: bottomright}

  - id: window_restore
    phrases: {ar: ["اعد النافذة لحجمها", "ارجع النافذة"], en: ["restore window", "unmaximize window"], fr: ["restaure la fenêtre"]}
    action: snap
    args: {position: restore}

  - id: center_window
    phrases: {ar: [" ضع النافذة في الوسط", "وسط النافذة"], en: ["center the window"], fr: ["centre la fenêtre"]}
    action: center_window

  - id: window_move_right
    phrases: {ar: ["حرك النافذة لليمين"], en: ["move window right"], fr: ["déplace la fenêtre à droite"]}
    action: move_window
    args: {dx: 1, dy: 0, step: 80}

  - id: window_move_left
    phrases: {ar: ["حرك النافذة لليسار"], en: ["move window left"], fr: ["déplace la fenêtre à gauche"]}
    action: move_window
    args: {dx: -1, dy: 0, step: 80}

  - id: window_move_up
    phrases: {ar: ["حرك النافذة للاعلى"], en: ["move window up"], fr: ["déplace la fenêtre en haut"]}
    action: move_window
    args: {dx: 0, dy: -1, step: 80}

  - id: window_move_down
    phrases: {ar: ["حرك النافذة للاسفل"], en: ["move window down"], fr: ["déplace la fenêtre en bas"]}
    action: move_window
    args: {dx: 0, dy: 1, step: 80}

  - id: window_grow
    phrases: {ar: ["وسع النافذة", "اجعل النافذة اكبر تدريجيا"], en: ["make window bigger", "grow window"], fr: ["étends la fenêtre", "rends la fenêtre plus grande"]}
    action: resize_window
    args: {dw: 1, dh: 1, step: 80}

  - id: window_shrink
    phrases: {ar: ["قلص النافذة", "اجعل النافذة اصغر تدريجيا"], en: ["make window smaller", "shrink window"], fr: ["rétrécis la fenêtre", "rends la fenêtre plus petite"]}
    action: resize_window
    args: {dw: -1, dh: -1, step: 80}

  - id: window_always_on_top
    phrases: {ar: ["النافذة فوق كل شيء", "ثبت النافذة في الاعلى"], en: ["keep window on top", "always on top"], fr: ["fenêtre toujours au premier plan"]}
    action: always_on_top
    args: {enabled: true}

  # الانتقال إلى نافذة بالاسم: {app} يلتقط باقي الكلام
  - id: focus_window
    phrases: {ar: ["انتقل الى {app}", "افتح نافذة {app}", "اذهب الى {app}"], en: ["switch to {app}", "go to {app}", "focus {app}"], fr: ["passe à {app}", "va vers {app}", "affiche {app}"]}
    action: focus_window
    args: {query: "{app}"}

  # ---------------- الشاشات ----------------
  - id: move_to_second_screen
    phrases: {ar: ["انقل النافذة للشاشة الثانية", "اعرضها على الشاشة الثانية"], en: ["move window to second screen", "show on second monitor"], fr: ["déplace la fenêtre sur le second écran"]}
    action: move_to_monitor
    args: {index: 1}

  - id: move_to_first_screen
    phrases: {ar: ["انقل النافذة للشاشة الرئيسية", "الشاشة الأولى"], en: ["move window to main screen", "first monitor"], fr: ["déplace la fenêtre sur l'écran principal"]}
    action: move_to_monitor
    args: {index: 0}

  - id: display_extend
    phrases: {ar: ["وسع الشاشتين", "ادمج الشاشتين"], en: ["extend both screens", "extend displays"], fr: ["étends les deux écrans"]}
    action: display_mode
    args: {mode: extend}

  - id: display_duplicate
    phrases: {ar: ["كرر الصورة على الشاشتين", "انسخ الشاشة"], en: ["duplicate the screen", "mirror displays"], fr: ["duplique l'écran", "miroir les écrans"]}
    action: display_mode
    args: {mode: duplicate}

  - id: display_next
